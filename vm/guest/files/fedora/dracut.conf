# Breadstick VM: an initramfs that boots any VM, never only the machine it was made on (the bake runs in a container),
# with the drivers crosvm's devices need beside the ones Fedora builds in (virtio_pci, virtio_blk, virtio_console, ext4).
hostonly="no"
add_drivers+=" virtio_balloon vsock vmw_vsock_virtio_transport "
