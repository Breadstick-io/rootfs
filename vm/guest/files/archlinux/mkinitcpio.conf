# Breadstick VM (plan 5.14 V4/V7): an initramfs for any VM (no autodetect: the bake runs in a container), carrying and
# loading what the agent, networking and /mnt/host need. Loaded here, they stay loaded after the switch to the real
# root, so Linux keeps its agent and network even when it boots a kernel whose modules pacman has since removed. No
# block hook: virtio_blk is the one disk a VM has (MODULES), and every other storage driver would only make the pair
# the app copies out larger.
MODULES=(virtio_pci virtio_blk virtio_console virtio_balloon virtio_net vsock vmw_vsock_virtio_transport ext4 dummy nf_tables nft_redir fuse)
HOOKS=(base systemd modconf filesystems fsck)
